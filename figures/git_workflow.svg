<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" style="background-color: #f9f9f9;">
  <!-- Title -->
  <text x="500" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">실제 Git 협업 워크플로우</text>

  <!-- Time progression (top to bottom) -->
  <line x1="50" y1="80" x2="50" y2="480" stroke="#ccc" stroke-width="2"/>

  <!-- Timeline labels -->
  <text x="30" y="100" font-size="12" font-weight="bold" fill="#666">Day 1</text>
  <text x="30" y="180" font-size="12" font-weight="bold" fill="#666">Day 2</text>
  <text x="30" y="280" font-size="12" font-weight="bold" fill="#666">Day 3</text>
  <text x="30" y="380" font-size="12" font-weight="bold" fill="#666">Day 4</text>

  <!-- Step 1: Clone -->
  <g>
    <rect x="80" y="80" width="380" height="60" fill="#667eea" fill-opacity="0.1" stroke="#667eea" stroke-width="2" rx="4"/>
    <text x="270" y="105" font-size="13" font-weight="bold" fill="#667eea">1. git clone (프로젝트 복제)</text>
    <text x="270" y="125" font-size="11" fill="#333">$ git clone https://github.com/user/project.git</text>
  </g>

  <!-- Status check -->
  <circle cx="500" cy="110" r="8" fill="#667eea"/>
  <text x="540" y="100" font-size="11" fill="#333">master 브랜치</text>
  <text x="540" y="115" font-size="11" fill="#333">최신 상태 확보</text>

  <!-- Step 2: Create branch -->
  <g>
    <rect x="80" y="160" width="380" height="60" fill="#2196F3" fill-opacity="0.1" stroke="#2196F3" stroke-width="2" rx="4"/>
    <text x="270" y="185" font-size="13" font-weight="bold" fill="#2196F3">2. git checkout -b feature/new (브랜치 생성)</text>
    <text x="270" y="205" font-size="11" fill="#333">$ git checkout -b feature/new-feature</text>
  </g>

  <!-- Work indicators -->
  <circle cx="500" cy="190" r="8" fill="#2196F3"/>
  <text x="540" y="180" font-size="11" fill="#333">독립적인</text>
  <text x="540" y="195" font-size="11" fill="#333">작업 공간</text>

  <!-- Step 3: Code changes -->
  <g>
    <rect x="80" y="240" width="380" height="60" fill="#FF9800" fill-opacity="0.1" stroke="#FF9800" stroke-width="2" rx="4"/>
    <text x="270" y="265" font-size="13" font-weight="bold" fill="#FF9800">3. 코드 수정 및 커밋</text>
    <text x="270" y="285" font-size="11" fill="#333">$ git add . && git commit -m "Add new feature"</text>
  </g>

  <!-- Commit logs -->
  <circle cx="500" cy="270" r="8" fill="#FF9800"/>
  <text x="540" y="260" font-size="11" fill="#333">여러 번</text>
  <text x="540" y="275" font-size="11" fill="#333">커밋 가능</text>

  <!-- Step 4: Push and PR -->
  <g>
    <rect x="80" y="340" width="380" height="60" fill="#f44336" fill-opacity="0.1" stroke="#f44336" stroke-width="2" rx="4"/>
    <text x="270" y="365" font-size="13" font-weight="bold" fill="#f44336">4. git push & Pull Request</text>
    <text x="270" y="385" font-size="11" fill="#333">$ git push origin feature/new-feature</text>
  </g>

  <!-- Remote sync -->
  <circle cx="500" cy="370" r="8" fill="#f44336"/>
  <text x="540" y="360" font-size="11" fill="#333">원격 저장소</text>
  <text x="540" y="375" font-size="11" fill="#333">에 업로드</text>

  <!-- Step 5: Merge -->
  <g>
    <rect x="80" y="430" width="380" height="60" fill="#4CAF50" fill-opacity="0.1" stroke="#4CAF50" stroke-width="2" rx="4"/>
    <text x="270" y="455" font-size="13" font-weight="bold" fill="#4CAF50">5. git merge & cleanup</text>
    <text x="270" y="475" font-size="11" fill="#333">$ git checkout master && git pull && git branch -d feature/new</text>
  </g>

  <!-- Final state -->
  <circle cx="500" cy="460" r="8" fill="#4CAF50"/>
  <text x="540" y="450" font-size="11" fill="#333">master 최신화</text>
  <text x="540" y="465" font-size="11" fill="#333">& 정리</text>

  <!-- Right side: Common issues & solutions -->
  <g>
    <rect x="550" y="80" width="420" height="400" fill="#FFF3E0" stroke="#FF9800" stroke-width="1" rx="4"/>

    <text x="570" y="105" font-size="12" font-weight="bold" fill="#E65100">자주 하는 실수 & 해결법</text>

    <!-- Mistake 1 -->
    <text x="570" y="135" font-size="11" font-weight="bold" fill="#D32F2F">❌ master에서 직접 수정</text>
    <text x="570" y="150" font-size="10" fill="#333">→ 항상 브랜치를 먼저 만들고 작업하세요</text>
    <text x="570" y="165" font-size="10" fill="#999" font-family="monospace">git checkout -b feature/xxx</text>

    <!-- Mistake 2 -->
    <text x="570" y="195" font-size="11" font-weight="bold" fill="#D32F2F">❌ Pull하지 않고 Push</text>
    <text x="570" y="210" font-size="10" fill="#333">→ 항상 Push 전에 최신 상태 확인</text>
    <text x="570" y="225" font-size="10" fill="#999" font-family="monospace">git pull origin master</text>

    <!-- Mistake 3 -->
    <text x="570" y="255" font-size="11" font-weight="bold" fill="#D32F2F">❌ 커밋 메시지 너무 짧음</text>
    <text x="570" y="270" font-size="10" fill="#333">→ 변경 사항과 이유를 명확히 작성</text>
    <text x="570" y="285" font-size="10" fill="#999" font-family="monospace">"Fix: bug in login"보다<br/>"Fix: prevent XSS in login form"</text>

    <!-- Mistake 4 -->
    <text x="570" y="315" font-size="11" font-weight="bold" fill="#D32F2F">❌ 큰 덩어리로 한 번에 커밋</text>
    <text x="570" y="330" font-size="10" fill="#333">→ 논리적 단위로 여러 커밋 분리</text>
    <text x="570" y="345" font-size="10" fill="#999" font-family="monospace">한 기능 = 한두 개의 커밋</text>

    <!-- Tip -->
    <rect x="560" y="370" width="400" height="50" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1" rx="3"/>
    <text x="580" y="390" font-size="11" font-weight="bold" fill="#2E7D32">💡 팁: 자주 Push하세요!</text>
    <text x="580" y="405" font-size="10" fill="#333">로컬에만 있으면 손실 위험이 있습니다.</text>
  </g>
</svg>