<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" style="background-color: #f9f9f9;">
  <!-- Title -->
  <text x="450" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">커밋 히스토리 시각화</text>

  <!-- Timeline -->
  <line x1="100" y1="150" x2="800" y2="150" stroke="#ccc" stroke-width="2"/>

  <!-- Commit 1 -->
  <circle cx="150" cy="150" r="15" fill="#667eea" stroke="#fff" stroke-width="2"/>
  <text x="150" y="155" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">A</text>
  <text x="150" y="190" font-size="11" text-anchor="middle" fill="#333">Initial commit</text>
  <text x="150" y="205" font-size="10" text-anchor="middle" fill="#999">abc1234</text>

  <!-- Commit 2 -->
  <circle cx="300" cy="150" r="15" fill="#667eea" stroke="#fff" stroke-width="2"/>
  <text x="300" y="155" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">B</text>
  <text x="300" y="190" font-size="11" text-anchor="middle" fill="#333">Add README</text>
  <text x="300" y="205" font-size="10" text-anchor="middle" fill="#999">def5678</text>

  <!-- Commit 3 -->
  <circle cx="450" cy="150" r="15" fill="#667eea" stroke="#fff" stroke-width="2"/>
  <text x="450" y="155" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">C</text>
  <text x="450" y="190" font-size="11" text-anchor="middle" fill="#333">Update docs</text>
  <text x="450" y="205" font-size="10" text-anchor="middle" fill="#999">ghi9012</text>

  <!-- Commit 4 (HEAD) -->
  <circle cx="600" cy="150" r="15" fill="#FF9800" stroke="#fff" stroke-width="3"/>
  <text x="600" y="155" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">D</text>
  <text x="600" y="190" font-size="11" text-anchor="middle" fill="#333">Fix bug</text>
  <text x="600" y="205" font-size="10" text-anchor="middle" fill="#999">jkl3456</text>

  <!-- Commit 5 (future) -->
  <circle cx="750" cy="150" r="15" fill="#ccc" stroke="#999" stroke-width="2" stroke-dasharray="2,2"/>
  <text x="750" y="155" font-size="12" font-weight="bold" text-anchor="middle" fill="#666">?</text>
  <text x="750" y="190" font-size="11" text-anchor="middle" fill="#999">다음 커밋</text>

  <!-- Branch pointers -->
  <g>
    <!-- master pointer -->
    <line x1="600" y1="140" x2="600" y2="110" stroke="#2196F3" stroke-width="2"/>
    <polygon points="600,110 595,120 605,120" fill="#2196F3"/>
    <text x="630" y="125" font-size="12" font-weight="bold" fill="#2196F3">master</text>
  </g>

  <g>
    <!-- HEAD pointer -->
    <line x1="600" y1="165" x2="600" y2="240" stroke="#f44336" stroke-width="2"/>
    <polygon points="600,240 595,230 605,230" fill="#f44336"/>
    <text x="630" y="255" font-size="12" font-weight="bold" fill="#f44336">HEAD</text>
  </g>

  <!-- Info box -->
  <rect x="50" y="280" width="800" height="60" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4"/>
  <text x="70" y="305" font-size="12" fill="#333"><tspan font-weight="bold">커밋 히스토리:</tspan> 각 커밋은 이전 커밋을 참조하며, 이를 통해 프로젝트 변화의 전체 기록이 유지됩니다.</text>
  <text x="70" y="325" font-size="12" fill="#666">HEAD는 현재 작업 위치를 가리킵니다. 새 커밋을 만들면 HEAD가 새 커밋을 가리키도록 업데이트됩니다.</text>
</svg>