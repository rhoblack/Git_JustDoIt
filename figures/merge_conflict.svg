<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" style="background-color: #f9f9f9;">
  <!-- Title -->
  <text x="450" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">Merge와 충돌(Conflict)</text>

  <!-- Before Merge -->
  <text x="450" y="70" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">병합 전 상태</text>

  <!-- Master branch -->
  <line x1="100" y1="130" x2="300" y2="130" stroke="#2196F3" stroke-width="3"/>
  <circle cx="100" cy="130" r="10" fill="#2196F3" stroke="#fff" stroke-width="2"/>
  <text x="100" y="135" font-size="9" font-weight="bold" text-anchor="middle" fill="#fff">A</text>
  <circle cx="180" cy="130" r="10" fill="#2196F3" stroke="#fff" stroke-width="2"/>
  <text x="180" y="135" font-size="9" font-weight="bold" text-anchor="middle" fill="#fff">B</text>
  <circle cx="260" cy="130" r="10" fill="#2196F3" stroke="#fff" stroke-width="2"/>
  <text x="260" y="135" font-size="9" font-weight="bold" text-anchor="middle" fill="#fff">C</text>
  <text x="260" y="155" font-size="11" font-weight="bold" text-anchor="middle" fill="#2196F3">master</text>

  <!-- Feature branch -->
  <line x1="180" y1="130" x2="180" y2="200" stroke="#2196F3" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="180" y1="200" x2="380" y2="200" stroke="#FF9800" stroke-width="3"/>
  <circle cx="240" cy="200" r="10" fill="#FF9800" stroke="#fff" stroke-width="2"/>
  <text x="240" y="205" font-size="9" font-weight="bold" text-anchor="middle" fill="#fff">D</text>
  <circle cx="320" cy="200" r="10" fill="#FF9800" stroke="#fff" stroke-width="2"/>
  <text x="320" y="205" font-size="9" font-weight="bold" text-anchor="middle" fill="#fff">E</text>
  <text x="380" y="220" font-size="11" font-weight="bold" fill="#FF9800">feature</text>

  <!-- After Merge - Success Case -->
  <text x="450" y="280" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">병합 성공 (충돌 없음)</text>

  <line x1="100" y1="340" x2="500" y2="340" stroke="#2196F3" stroke-width="3"/>
  <circle cx="100" cy="340" r="10" fill="#2196F3" stroke="#fff" stroke-width="2"/>
  <text x="100" y="345" font-size="9" font-weight="bold" text-anchor="middle" fill="#fff">A</text>
  <circle cx="180" cy="340" r="10" fill="#2196F3" stroke="#fff" stroke-width="2"/>
  <text x="180" y="345" font-size="9" font-weight="bold" text-anchor="middle" fill="#fff">B</text>
  <circle cx="260" cy="340" r="10" fill="#2196F3" stroke="#fff" stroke-width="2"/>
  <text x="260" y="345" font-size="9" font-weight="bold" text-anchor="middle" fill="#fff">C</text>
  <circle cx="380" cy="340" r="10" fill="#2196F3" stroke="#fff" stroke-width="2"/>
  <text x="380" y="345" font-size="9" font-weight="bold" text-anchor="middle" fill="#fff">M</text>
  <circle cx="500" cy="340" r="10" fill="#2196F3" stroke="#fff" stroke-width="2"/>
  <text x="500" y="345" font-size="9" font-weight="bold" text-anchor="middle" fill="#fff">F</text>

  <!-- Merge arrows -->
  <line x1="240" y1="200" x2="320" y2="330" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="320" y1="200" x2="380" y2="330" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="500" y="360" font-size="11" font-weight="bold" text-anchor="middle" fill="#2196F3">master (병합 완료)</text>

  <!-- Conflict Case -->
  <text x="450" y="400" font-size="14" font-weight="bold" text-anchor="middle" fill="#f44336">⚠ 같은 파일을 동시에 수정 → 충돌 발생!</text>

  <!-- Example conflict marker -->
  <rect x="550" y="300" width="300" height="100" fill="#fff3e0" stroke="#f44336" stroke-width="2" rx="4"/>
  <text x="570" y="320" font-size="11" font-weight="bold" fill="#f44336"><<<<<<< HEAD</text>
  <text x="570" y="340" font-size="11" fill="#333">master 버전의 코드</text>
  <text x="570" y="360" font-size="11" font-weight="bold" fill="#f44336">=======</text>
  <text x="570" y="380" font-size="11" fill="#333">feature 버전의 코드</text>
  <text x="570" y="400" font-size="11" font-weight="bold" fill="#f44336">>>>>>>> feature</text>
</svg>