<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" style="background-color: #f9f9f9;">
  <!-- Title -->
  <text x="450" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">브랜치(Branch) 개념</text>

  <!-- Master branch line -->
  <line x1="100" y1="100" x2="350" y2="100" stroke="#2196F3" stroke-width="3"/>

  <!-- Commit A -->
  <circle cx="100" cy="100" r="12" fill="#2196F3" stroke="#fff" stroke-width="2"/>
  <text x="100" y="105" font-size="10" font-weight="bold" text-anchor="middle" fill="#fff">A</text>

  <!-- Commit B (on master) -->
  <circle cx="180" cy="100" r="12" fill="#2196F3" stroke="#fff" stroke-width="2"/>
  <text x="180" y="105" font-size="10" font-weight="bold" text-anchor="middle" fill="#fff">B</text>

  <!-- Branch point -->
  <circle cx="260" cy="100" r="12" fill="#2196F3" stroke="#fff" stroke-width="2"/>
  <text x="260" y="105" font-size="10" font-weight="bold" text-anchor="middle" fill="#fff">C</text>

  <!-- feature branch line -->
  <line x1="260" y1="100" x2="260" y2="200" stroke="#2196F3" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="260" y1="200" x2="500" y2="200" stroke="#f44336" stroke-width="3"/>

  <!-- Commits on feature branch -->
  <circle cx="340" cy="200" r="12" fill="#f44336" stroke="#fff" stroke-width="2"/>
  <text x="340" y="205" font-size="10" font-weight="bold" text-anchor="middle" fill="#fff">D</text>

  <circle cx="420" cy="200" r="12" fill="#f44336" stroke="#fff" stroke-width="2"/>
  <text x="420" y="205" font-size="10" font-weight="bold" text-anchor="middle" fill="#fff">E</text>

  <circle cx="500" cy="200" r="12" fill="#f44336" stroke="#fff" stroke-width="2"/>
  <text x="500" y="205" font-size="10" font-weight="bold" text-anchor="middle" fill="#fff">F</text>

  <!-- Continue master branch -->
  <line x1="350" y1="100" x2="600" y2="100" stroke="#2196F3" stroke-width="3"/>

  <!-- Commits on master -->
  <circle cx="430" cy="100" r="12" fill="#2196F3" stroke="#fff" stroke-width="2"/>
  <text x="430" y="105" font-size="10" font-weight="bold" text-anchor="middle" fill="#fff">G</text>

  <circle cx="510" cy="100" r="12" fill="#2196F3" stroke="#fff" stroke-width="2"/>
  <text x="510" y="105" font-size="10" font-weight="bold" text-anchor="middle" fill="#fff">H</text>

  <circle cx="600" cy="100" r="12" fill="#2196F3" stroke="#fff" stroke-width="2"/>
  <text x="600" y="105" font-size="10" font-weight="bold" text-anchor="middle" fill="#fff">I</text>

  <!-- Branch labels -->
  <rect x="350" y="115" width="80" height="25" fill="#2196F3" rx="4"/>
  <text x="390" y="133" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">master</text>

  <rect x="500" y="215" width="100" height="25" fill="#f44336" rx="4"/>
  <text x="550" y="233" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">feature/new</text>

  <!-- Annotations -->
  <text x="260" y="130" font-size="11" fill="#666">← 브랜치 생성</text>
  <text x="180" y="70" font-size="11" fill="#666">공유 히스토리</text>
  <text x="420" y="240" font-size="11" fill="#666">독립적 개발</text>

  <!-- Info box -->
  <rect x="50" y="310" width="800" height="80" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4"/>
  <text x="70" y="330" font-size="12" fill="#333"><tspan font-weight="bold">브랜치란:</tspan> 특정 커밋을 가리키는 '포인터'입니다. 한 저장소에서 여러 브랜치가 동시에 존재할 수 있습니다.</text>
  <text x="70" y="350" font-size="12" fill="#333"><tspan font-weight="bold">장점:</tspan> 기능 개발, 버그 수정, 실험 등을 독립적으로 진행한 후 완료된 것만 메인 브랜치에 합칠 수 있습니다.</text>
  <text x="70" y="370" font-size="12" fill="#333"><tspan font-weight="bold">워크플로우:</tspan> master에서 기능용 브랜치를 만들고 → 작업 → 테스트 → merge → 브랜치 삭제</text>
</svg>