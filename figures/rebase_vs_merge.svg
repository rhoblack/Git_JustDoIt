<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" style="background-color: #f9f9f9;">
  <!-- Title -->
  <text x="450" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">Rebase vs Merge</text>

  <!-- Initial State -->
  <text x="450" y="70" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">병합 전 상태 (같음)</text>

  <!-- Master -->
  <line x1="100" y1="110" x2="300" y2="110" stroke="#2196F3" stroke-width="2"/>
  <circle cx="100" cy="110" r="8" fill="#2196F3"/>
  <circle cx="180" cy="110" r="8" fill="#2196F3"/>
  <circle cx="260" cy="110" r="8" fill="#2196F3"/>

  <!-- Feature -->
  <line x1="180" y1="110" x2="180" y2="160" stroke="#2196F3" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="180" y1="160" x2="340" y2="160" stroke="#f44336" stroke-width="2"/>
  <circle cx="220" cy="160" r="8" fill="#f44336"/>
  <circle cx="280" cy="160" r="8" fill="#f44336"/>
  <circle cx="340" cy="160" r="8" fill="#f44336"/>

  <text x="280" y="185" font-size="10" text-anchor="middle" fill="#f44336">feature</text>
  <text x="260" y="85" font-size="10" text-anchor="middle" fill="#2196F3">master</text>

  <!-- MERGE APPROACH -->
  <text x="200" y="240" font-size="13" font-weight="bold" fill="#2196F3">Merge 방식</text>

  <!-- Merge result -->
  <line x1="100" y1="280" x2="500" y2="280" stroke="#2196F3" stroke-width="2"/>
  <circle cx="100" cy="280" r="6" fill="#2196F3"/>
  <circle cx="160" cy="280" r="6" fill="#2196F3"/>
  <circle cx="220" cy="280" r="6" fill="#2196F3"/>
  <circle cx="280" cy="280" r="6" fill="#2196F3"/>

  <!-- Merge lines -->
  <line x1="220" y1="160" x2="280" y2="270" stroke="#999" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="280" y1="160" x2="320" y2="270" stroke="#999" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Merge commit -->
  <circle cx="380" cy="280" r="8" fill="#FF9800" stroke="#fff" stroke-width="2"/>
  <text x="380" y="285" font-size="9" font-weight="bold" text-anchor="middle" fill="#fff">M</text>

  <line x1="380" y1="280" x2="500" y2="280" stroke="#2196F3" stroke-width="2"/>
  <circle cx="500" cy="280" r="6" fill="#2196F3"/>

  <text x="450" y="310" font-size="11" fill="#333" text-anchor="middle">
    <tspan font-weight="bold">특징:</tspan> merge commit이 생겨 히스토리가 복잡해짐
  </text>

  <!-- REBASE APPROACH -->
  <text x="650" y="240" font-size="13" font-weight="bold" fill="#f44336">Rebase 방식</text>

  <!-- Rebase result -->
  <line x1="550" y1="280" x2="850" y2="280" stroke="#2196F3" stroke-width="2"/>
  <circle cx="550" cy="280" r="6" fill="#2196F3"/>
  <circle cx="610" cy="280" r="6" fill="#2196F3"/>
  <circle cx="670" cy="280" r="6" fill="#2196F3"/>
  <circle cx="730" cy="280" r="6" fill="#2196F3"/>
  <circle cx="790" cy="280" r="6" fill="#f44336"/>
  <circle cx="850" cy="280" r="6" fill="#f44336"/>

  <text x="750" y="310" font-size="11" fill="#333" text-anchor="middle">
    <tspan font-weight="bold">특징:</tspan> 선형 히스토리, 커밋 순서 재정렬
  </text>

  <!-- Comparison box -->
  <rect x="50" y="350" width="800" height="100" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4"/>

  <text x="70" y="375" font-size="11" font-weight="bold" fill="#333">Merge:</text>
  <text x="70" y="390" font-size="10" fill="#333">✓ 히스토리 보존 | ✓ 간단함 | ✗ 복잡한 히스토리 | ✓ 협업 기본</text>

  <text x="70" y="415" font-size="11" font-weight="bold" fill="#333">Rebase:</text>
  <text x="70" y="430" font-size="10" fill="#333">✓ 깔끔한 히스토리 | ✓ 선형 흐름 | ✗ 복잡한 명령어 | ⚠ 공개 브랜치에서 위험</text>
</svg>